// SPDX-License-Identifier: MIT

plugins {
    id 'java-library'
    id 'checkstyle'
    id 'maven-publish'
    id 'io.github.janguenter.bluemap-addon.java-conventions'
}

group = addon_group
version = addon_version

base {
    archivesName = artifact_id
}

sourceSets {
    main.java.srcDir 'modules/bluemap-addon-render-core/src/main/java'
    main.java.srcDir 'modules/bluemap-addon-adapter-api/src/main/java'
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.bluecolored.de/releases')
        content { includeGroupByRegex('de\\.bluecolored.*') }
    }
}

dependencies {
    compileOnly "de.bluecolored:bluemap-core:${bluemap_version}"
    compileOnly 'org.jetbrains:annotations:23.0.0'

    testImplementation "de.bluecolored:bluemap-core:${bluemap_version}"
    testImplementation 'org.jetbrains:annotations:23.0.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    def pipezJar = providers.gradleProperty('pipezJar')
    if (pipezJar.isPresent()) {
        systemProperty 'pipezJar', pipezJar.get()
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Automatic-Module-Name': 'io.github.janguenter.bluemap.pipez',
                'Implementation-Title': addon_name,
                'Implementation-Version': project.version.toString()
        )
    }
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-pipez-addon' }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-pipez-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-pipez-addon.md' }
    }
    from('provenance/upstreams.json') {
        into 'META-INF/bluemap-pipez'
    }
}

tasks.named('sourcesJar', Jar).configure {
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-pipez-addon' }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-pipez-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-pipez-addon.md' }
    }
    from('provenance/upstreams.json') {
        into 'META-INF/bluemap-pipez'
    }
}

def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def publishedSourcesJar = tasks.named('sourcesJar', Jar).flatMap { it.archiveFile }
def sharedRenderCorePackage =
        'io/github/janguenter/bluemap/addon/render/core/adapter/bluemap523/'
def sharedRenderCoreClasses = [
        "${sharedRenderCorePackage}FaceLighting.class",
        "${sharedRenderCorePackage}FaceLighting\$Sample.class"
].collect { it.toString() }
def sharedRenderCoreSources = [
        "${sharedRenderCorePackage}FaceLighting.java"
].collect { it.toString() }
def sharedAdapterApiPackage =
        'io/github/janguenter/bluemap/addon/adapter/api/bluemap523/'
def sharedAdapterApiClasses = [
        'BlueMapRuntimeCompatibility.class',
        'RegistryGuard.class',
        'ResourceExtensionType.class',
        'SyntheticDispatch.class'
].collect { sharedAdapterApiPackage + it }
def sharedAdapterApiSources = [
        'BlueMapRuntimeCompatibility.java',
        'RegistryGuard.java',
        'ResourceExtensionType.java',
        'SyntheticDispatch.java'
].collect { sharedAdapterApiPackage + it }
def legacyLocalAdapterPackage =
        'io/github/janguenter/bluemap/pipez/adapter/bluemap522/'
def legacySharedRenderCorePackage =
        'io/github/janguenter/bluemap/addon/render/core/adapter/bluemap522/'
def displacedAdapterHelpers = [
        'io/github/janguenter/bluemap/pipez/adapter/bluemap523/AdapterCompatibility',
        'io/github/janguenter/bluemap/pipez/adapter/bluemap523/PipezResourceExtensionType'
]
tasks.register('verifyProductionJar') {
    dependsOn tasks.named('jar')
    inputs.file(productionJar)

    doLast {
        def jarFile = inputs.files.singleFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'bluemap.addon.json',
                    'assets/bluemap_pipez/blockstates/pipe_shape.json',
                    'bluemap-pipez/profiles/exact-artifacts.json',
                    'bluemap-pipez/profiles/pipez/1.21.1-1.2.31/profile.json',
                    'bluemap-pipez/profiles/pipez/1.21.1-1.2.31/required-resources.tsv',
                    'META-INF/LICENSE-bluemap-pipez-addon',
                    'META-INF/NOTICE-bluemap-pipez-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-pipez-addon.md',
                    'META-INF/bluemap-pipez/upstreams.json'
            ] + sharedRenderCoreClasses + sharedAdapterApiClasses
            def missing = required.findAll { !entries.contains(it) }
            def duplicateShared = sharedRenderCoreClasses.findAll { shared ->
                entries.count { it == shared } != 1
            } + sharedAdapterApiClasses.findAll { shared ->
                entries.count { it == shared } != 1
            }
            if (!missing.isEmpty() || !duplicateShared.isEmpty()) {
                throw new GradleException(
                        "Production JAR shared boundary mismatch: missing=${missing}, "
                                + "nonUnique=${duplicateShared}"
                )
            }
            def addon = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry('bluemap.addon.json')).getText('UTF-8')
            )
            if (addon.id != addon_id
                    || addon.entrypoint != 'io.github.janguenter.bluemap.pipez.BlueMapPipezAddon'
                    || addon.dependencies != []
                    || addon['soft-dependencies'] != []) {
                throw new GradleException('BlueMap add-on metadata mismatch')
            }
            def foreignClasses = entries.findAll {
                it.endsWith('.class')
                        && !it.startsWith('io/github/janguenter/bluemap/pipez/')
                        && !sharedRenderCoreClasses.contains(it)
                        && !sharedAdapterApiClasses.contains(it)
            }
            def forbidden = entries.findAll {
                it.endsWith('.jar')
                        || it == 'META-INF/neoforge.mods.toml'
                        || it == 'fabric.mod.json'
                        || it.endsWith('.mixins.json')
                        || it.startsWith('assets/pipez/')
                        || it.startsWith('de/bluecolored/')
                        || it.startsWith('de/maxhenkel/')
                        || it.startsWith('net/minecraft/')
                        || it.startsWith('net/neoforged/')
                        || it.startsWith(legacyLocalAdapterPackage)
                        || it.startsWith(legacySharedRenderCorePackage)
                        || displacedAdapterHelpers.any { helper -> it.startsWith(helper) }
                        || (it.startsWith(sharedRenderCorePackage)
                            && !sharedRenderCoreClasses.contains(it))
                        || (it.startsWith(sharedAdapterApiPackage)
                            && !sharedAdapterApiClasses.contains(it))
            }
            if (!foreignClasses.isEmpty() || !forbidden.isEmpty()) {
                throw new GradleException(
                        "Production JAR boundary mismatch: foreignClasses=${foreignClasses}, "
                                + "forbidden=${forbidden}"
                )
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('verifySourcesJar') {
    dependsOn tasks.named('sourcesJar')
    inputs.file(publishedSourcesJar)

    doLast {
        def jarFile = inputs.files.singleFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'io/github/janguenter/bluemap/pipez/BlueMapPipezAddon.java',
                    'io/github/janguenter/bluemap/pipez/adapter/bluemap523/PipezRenderer.java',
                    'bluemap.addon.json',
                    'bluemap-pipez/profiles/exact-artifacts.json',
                    'bluemap-pipez/profiles/pipez/1.21.1-1.2.31/profile.json',
                    'bluemap-pipez/profiles/pipez/1.21.1-1.2.31/required-resources.tsv',
                    'META-INF/LICENSE-bluemap-pipez-addon',
                    'META-INF/NOTICE-bluemap-pipez-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-pipez-addon.md',
                    'META-INF/bluemap-pipez/upstreams.json'
            ] + sharedRenderCoreSources + sharedAdapterApiSources
            def missing = required.findAll { !entries.contains(it) }
            def duplicateShared = sharedRenderCoreSources.findAll { shared ->
                entries.count { it == shared } != 1
            } + sharedAdapterApiSources.findAll { shared ->
                entries.count { it == shared } != 1
            }
            if (!missing.isEmpty() || !duplicateShared.isEmpty()) {
                throw new GradleException(
                        "Sources JAR shared boundary mismatch: missing=${missing}, "
                                + "nonUnique=${duplicateShared}"
                )
            }
            def projectJava = entries.findAll { it.endsWith('.java') }
            def foreignJava = projectJava.findAll {
                !it.startsWith('io/github/janguenter/bluemap/pipez/')
                        && !sharedRenderCoreSources.contains(it)
                        && !sharedAdapterApiSources.contains(it)
            }
            def forbidden = entries.findAll {
                it.endsWith('.class')
                        || it.endsWith('.jar')
                        || it.startsWith('assets/pipez/')
                        || it.startsWith('de/bluecolored/')
                        || it.startsWith('de/maxhenkel/')
                        || it.startsWith('net/minecraft/')
                        || it.startsWith('net/neoforged/')
                        || it.startsWith(legacyLocalAdapterPackage)
                        || it.startsWith(legacySharedRenderCorePackage)
                        || displacedAdapterHelpers.any { helper -> it == "${helper}.java" }
                        || (it.startsWith(sharedRenderCorePackage)
                            && !sharedRenderCoreSources.contains(it))
                        || (it.startsWith(sharedAdapterApiPackage)
                            && !sharedAdapterApiSources.contains(it))
            }
            if (projectJava.isEmpty() || !foreignJava.isEmpty() || !forbidden.isEmpty()) {
                throw new GradleException(
                        "Sources JAR boundary mismatch: foreignJava=${foreignJava}, "
                                + "forbidden=${forbidden}"
                )
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyProductionJar')
    dependsOn tasks.named('verifySourcesJar')
}

tasks.register('verifyPinnedArtifacts', Exec) {
    def pipezJar = providers.gradleProperty('pipezJar')
    doFirst {
        if (!pipezJar.isPresent()) {
            throw new GradleException(
                    'Set -PpipezJar to the exact ATM 1.2.0 Pipez artifact.'
            )
        }
    }
    commandLine 'python3', 'tools/verify_pinned_artifacts.py',
            '--pipez', pipezJar.getOrElse('missing')
}

publishing {
    publications {
        addon(MavenPublication) {
            from components.java
            artifactId = artifact_id
            pom {
                name = addon_name
                description = 'Exact-profile BlueMap rendering for stable Pipez connections and extractors.'
                url = 'https://github.com/jan-guenter/bluemap-pipez-addon'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://spdx.org/licenses/MIT.html'
                        distribution = 'repo'
                    }
                }
                scm {
                    url = 'https://github.com/jan-guenter/bluemap-pipez-addon'
                    connection = 'scm:git:https://github.com/jan-guenter/bluemap-pipez-addon.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/jan-guenter/bluemap-pipez-addon')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
